<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Paneli - Media QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 24px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { opacity: 0.7; margin-bottom: 32px; }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95rem; }
    input[type="password"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    input[type="file"] { padding: 10px; }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { display: none; }
    #result.show { display: block; }
    .qr-box {
      text-align: center;
      margin: 24px 0;
    }
    .qr-box img {
      max-width: 260px;
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }
    .link-box {
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .copy-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      font-size: 0.9rem;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.25); }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      color: #fca5a5;
    }
    .success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      color: #86efac;
    }
    .back { display: inline-block; margin-bottom: 24px; color: #a78bfa; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .spinner.show { display: block; }
    .progress-wrap {
      display: none;
      margin: 16px 0 18px;
    }
    .progress-wrap.show { display: block; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .progress-bar-shell {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      border-radius: inherit;
      transition: width 0.2s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">← Ana Sayfa</a>
    <h1>Yönetici Paneli</h1>
    <p class="subtitle">Video veya görsel yükle → QR + Link al</p>

    <div class="card">
      <div id="errorBox" class="error" style="display:none;"></div>
      
      <form id="uploadForm">
        <label for="password">Yönetici Şifresi</label>
        <input type="password" id="password" placeholder="Şifreyi girin" required autocomplete="current-password">

        <label for="file">Medya Dosyası (Resim / Video)</label>
        <input type="file" id="file" accept="image/*,video/*" required>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-label">
            <span>Yükleniyor</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-bar-shell">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <div class="spinner" id="spinner"></div>
        <button type="submit" class="btn" id="submitBtn">Yükle &amp; QR Oluştur</button>
      </form>
    </div>

    <div class="card" id="result">
      <div class="success">Medya başarıyla yüklendi!</div>
      <div class="qr-box">
        <img id="qrImage" src="" alt="QR Code">
      </div>
      <p style="margin-bottom:8px; opacity:0.8;">Paylaşım Linki:</p>
      <div class="link-box" id="mediaLink"></div>
      <button class="copy-btn" onclick="copyLink()">Linki Kopyala</button>
      <button class="copy-btn" onclick="downloadQR()">QR İndir</button>
      <a id="openLink" href="#" target="_blank" class="copy-btn" style="text-decoration:none; display:inline-block;">Aç</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('errorBox');
    const spinner = document.getElementById('spinner');
    const submitBtn = document.getElementById('submitBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const MAX_UPLOAD_BYTES = 100 * 1024 * 1024;

    function setProgress(percent) {
      progressBar.style.width = percent + '%';
      progressText.textContent = Math.round(percent) + '%';
    }

    function showLoadingState() {
      spinner.classList.add('show');
      progressWrap.classList.add('show');
      setProgress(0);
    }

    function hideLoadingState() {
      spinner.classList.remove('show');
      progressWrap.classList.remove('show');
      progressBar.style.width = '0%';
      progressText.textContent = '0%';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      result.classList.remove('show');
      showLoadingState();
      submitBtn.disabled = true;

      const password = document.getElementById('password').value;
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      if (!file) {
        showError('Dosya seçin');
        return;
      }

      if (file.size > MAX_UPLOAD_BYTES) {
        showError('Dosya çok büyük. Maksimum 100MB yükleme yapılabilir. Daha küçük bir dosya seçin.');
        return;
      }

      try {
        const configRes = await fetch('/api/upload', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + password
          }
        });

        const configText = await configRes.text();
        let configData = {};

        if (configText) {
          try {
            configData = JSON.parse(configText);
          } catch (parseErr) {
            throw new Error('Sunucu cevabı JSON değil: ' + configText.slice(0, 200));
          }
        }

        if (!configRes.ok) {
          throw new Error(configData.error || `İstek başarısız oldu (${configRes.status})`);
        }

        const cloudFormData = new FormData();
        cloudFormData.append('file', file);
        cloudFormData.append('api_key', configData.apiKey);
        cloudFormData.append('timestamp', String(configData.timestamp));
        cloudFormData.append('signature', configData.signature);
        cloudFormData.append('folder', configData.folder);

        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', configData.uploadUrl, true);

          xhr.upload.onprogress = (event) => {
            if (!event.lengthComputable) return;
            const percent = (event.loaded / event.total) * 100;
            setProgress(percent);
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const uploadData = JSON.parse(xhr.responseText);
                const mediaUrl = uploadData.secure_url || uploadData.url;
                const qrImageUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(mediaUrl);

                document.getElementById('qrImage').src = qrImageUrl;
                document.getElementById('mediaLink').textContent = mediaUrl;
                document.getElementById('openLink').href = mediaUrl;
                result.classList.add('show');
                window.currentQR = qrImageUrl;
                window.currentUrl = mediaUrl;
                setProgress(100);
                resolve();
              } catch (err) {
                reject(new Error('Cloudinary cevabı işlenemedi.'));
              }
            } else {
              try {
                const data = JSON.parse(xhr.responseText);
                reject(new Error(data.error?.message || 'Cloudinary yükleme başarısız oldu'));
              } catch {
                reject(new Error('Cloudinary yükleme başarısız oldu')); 
              }
            }
          };

          xhr.onerror = () => reject(new Error('Ağ hatası: Cloudinary yükleme başarısız oldu.'));
          xhr.send(cloudFormData);
        });
      } catch (err) {
        showError(err.message || 'Bilinmeyen hata');
      } finally {
        hideLoadingState();
        submitBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      hideLoadingState();
      submitBtn.disabled = false;
    }

    function copyLink() {
      navigator.clipboard.writeText(window.currentUrl).then(() => {
        alert('Link kopyalandı!');
      });
    }

    function downloadQR() {
      const a = document.createElement('a');
      a.href = window.currentQR;
      a.download = 'qr-code.png';
      a.click();
    }
  </script>
</body>
</html>
