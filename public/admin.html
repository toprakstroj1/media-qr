<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Paneli - Media QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 24px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { opacity: 0.7; margin-bottom: 32px; }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95rem; }
    input[type="password"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    input[type="file"] { padding: 10px; }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { display: none; }
    #result.show { display: block; }
    .qr-box {
      text-align: center;
      margin: 24px 0;
    }
    .qr-box img {
      max-width: 260px;
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }
    .link-box {
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .copy-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      font-size: 0.9rem;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.25); }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      color: #fca5a5;
    }
    .success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      color: #86efac;
    }
    .back { display: inline-block; margin-bottom: 24px; color: #a78bfa; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">← Ana Sayfa</a>
    <h1>Yönetici Paneli</h1>
    <p class="subtitle">Video veya görsel yükle → QR + Link al</p>

    <div class="card">
      <div id="errorBox" class="error" style="display:none;"></div>
      
      <form id="uploadForm">
        <label for="password">Yönetici Şifresi</label>
        <input type="password" id="password" placeholder="Şifreyi girin" required autocomplete="current-password">

        <label for="file">Medya Dosyası (Resim / Video)</label>
        <input type="file" id="file" accept="image/*,video/*" required>

        <div class="spinner" id="spinner"></div>
        <button type="submit" class="btn" id="submitBtn">Yükle &amp; QR Oluştur</button>
      </form>
    </div>

    <div class="card" id="result">
      <div class="success">Medya başarıyla yüklendi!</div>
      <div class="qr-box">
        <img id="qrImage" src="" alt="QR Code">
      </div>
      <p style="margin-bottom:8px; opacity:0.8;">Paylaşım Linki:</p>
      <div class="link-box" id="mediaLink"></div>
      <button class="copy-btn" onclick="copyLink()">Linki Kopyala</button>
      <button class="copy-btn" onclick="downloadQR()">QR İndir</button>
      <a id="openLink" href="#" target="_blank" class="copy-btn" style="text-decoration:none; display:inline-block;">Aç</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('errorBox');
    const spinner = document.getElementById('spinner');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      result.classList.remove('show');
      spinner.classList.add('show');
      submitBtn.disabled = true;

      const password = document.getElementById('password').value;
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      if (!file) {
        showError('Dosya seçin');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + password
          },
          body: formData
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Yükleme başarısız');
        }

        // Show result
        document.getElementById('qrImage').src = data.qr;
        document.getElementById('mediaLink').textContent = data.url;
        document.getElementById('openLink').href = data.url;
        result.classList.add('show');
        window.currentQR = data.qr;
        window.currentUrl = data.url;
      } catch (err) {
        showError(err.message);
      } finally {
        spinner.classList.remove('show');
        submitBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      spinner.classList.remove('show');
      submitBtn.disabled = false;
    }

    function copyLink() {
      navigator.clipboard.writeText(window.currentUrl).then(() => {
        alert('Link kopyalandı!');
      });
    }

    function downloadQR() {
      const a = document.createElement('a');
      a.href = window.currentQR;
      a.download = 'qr-code.png';
      a.click();
    }
  </script>
</body>
</html>
