<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medya Görüntüle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    img, video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    #loading {
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 1.1rem;
      opacity: 0.8;
    }
    #error {
      color: #f87171;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">Yükleniyor...</div>
    <div id="error">Medya bulunamadı veya yüklenemedi.</div>
  </div>

  <script>
    (function() {
      const path = window.location.pathname;
      // /m/uuid or /view.html?id=uuid (fallback)
      let id = null;
      const match = path.match(/\/m\/([a-f0-9\-]+)/i);
      if (match) {
        id = match[1];
      } else {
        const params = new URLSearchParams(window.location.search);
        id = params.get('id');
      }

      if (!id) {
        showError();
        return;
      }

      const mediaUrl = '/api/media/' + id;

      // First try to detect type by fetching headers (HEAD)
      fetch(mediaUrl, { method: 'HEAD' })
        .then(res => {
          if (!res.ok) throw new Error('not found');
          const type = res.headers.get('Content-Type') || '';
          const container = document.getElementById('container');
          document.getElementById('loading').style.display = 'none';

          if (type.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = mediaUrl;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.muted = false; // try with sound, user can unmute
            container.appendChild(video);
            // Some browsers block autoplay with sound
            video.play().catch(() => {
              video.muted = true;
              video.play();
            });
          } else {
            // Image
            const img = document.createElement('img');
            img.src = mediaUrl;
            img.alt = 'Medya';
            img.onload = () => {};
            img.onerror = showError;
            container.appendChild(img);
          }
        })
        .catch(() => showError());

      function showError() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
