<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Media QR ile resim ve video paylaşımı yap, QR kod oluştur ve hemen link paylaş. Hızlı, mobil uyumlu ve doğrudan medya paylaşımı.">
  <meta name="keywords" content="media qr, qr kod, resim paylaşımı, video paylaşımı, netlify qr, hızlı paylaşım">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f0c29">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Media QR | Direkt Medya Paylaşımı">
  <meta property="og:description" content="Video ve görsel yükle, anında QR kod ve paylaşım linki oluştur.">
  <meta property="og:image" content="https://mediaqr.netlify.app/og-image.png">
  <meta property="og:url" content="https://mediaqr.netlify.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Media QR | Direkt Medya Paylaşımı">
  <meta name="twitter:description" content="Resim ve video yükle, QR kod oluştur ve link paylaş.">
  <meta name="twitter:image" content="https://mediaqr.netlify.app/og-image.png">
  <title>Media QR - Direkt Medya Paylaşımı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { opacity: 0.8; margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }
    .features {
      margin-top: 40px;
      text-align: left;
      font-size: 0.95rem;
      opacity: 0.85;
    }
    .features li { margin-bottom: 10px; list-style: none; }
    .features li::before { content: "✓ "; color: #34d399; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Media QR</h1>
    <p>Video veya görsel yükle, anında QR kod ve link al. QR okutulunca medya direkt açılır.</p>
    <a href="/admin" class="btn">Yönetici Paneli →</a>
    <ul class="features">
      <li>Resim &amp; Video desteği</li>
      <li>Otomatik QR kod üretimi</li>
      <li>Direkt oynatma (ekstra tıklama yok)</li>
      <li>Netlify üzerinde ücretsiz host</li>
    </ul>
  </div>
</body>
</html>
