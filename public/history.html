<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tüm QR paylaşımlarını, dosya adlarını ve linklerini geçmiş sayfasında görüntüle.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f0c29">
  <meta property="og:title" content="Media QR Geçmişi">
  <meta property="og:description" content="Yapılan tüm QR ve medya linklerini geçmiş sayfasında incele.">
  <meta property="og:type" content="website">
  <title>QR Geçmişi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.9rem;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back {
      color: #d8c9ff;
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 16px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }
    th {
      background: rgba(255,255,255,0.04);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.8;
    }
    td {
      font-size: 0.95rem;
      word-break: break-word;
    }
    a.link {
      color: #93c5fd;
      text-decoration: none;
    }
    a.link:hover { text-decoration: underline; }
    .empty {
      padding: 32px 20px;
      text-align: center;
      opacity: 0.8;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      background: rgba(96,165,250,0.12);
      border: 1px solid rgba(96,165,250,0.3);
      color: #dbeafe;
    }
    @media (max-width: 760px) {
      th:nth-child(1), td:nth-child(1) { display: none; }
      .topbar { display: block; }
      .back { display: inline-block; margin-top: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>QR Geçmişi</h1>
      <a href="/admin" class="back">← Yönetici Paneli</a>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Dosya</th>
            <th>Tür</th>
            <th>Link</th>
            <th>QR</th>
            <th>Tarih</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none;">Henüz kayıt yok.</div>
    </div>
  </div>

  <script>
    async function loadHistory() {
      const rows = document.getElementById('rows');
      const empty = document.getElementById('empty');

      try {
        const res = await fetch('/api/history');
        if (!res.ok) throw new Error('History fetch failed');
        const data = await res.json();

        if (!Array.isArray(data) || !data.length) {
          empty.style.display = 'block';
          return;
        }

        rows.innerHTML = data.map((item, index) => {
          const date = item.uploadedAt ? new Date(item.uploadedAt).toLocaleString('tr-TR') : '—';
          const url = item.url || '#';
          const qr = item.qr ? '<a class="link" href="' + item.qr + '" target="_blank">Aç</a>' : '—';
          return `
            <tr>
              <td>${index + 1}</td>
              <td>${item.filename || '—'}</td>
              <td><span class="badge">${(item.type || 'unknown').split('/')[0] || 'dosya'}</span></td>
              <td><a class="link" href="${url}" target="_blank">Aç</a></td>
              <td>${qr}</td>
              <td>${date}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        rows.innerHTML = '<tr><td colspan="6">Geçmiş yüklenemedi.</td></tr>';
      }
    }

    loadHistory();
  </script>
</body>
</html>
